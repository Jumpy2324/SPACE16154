<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPACE16154 Cache Reset</title>
<style>
html,body{margin:0;min-height:100%;background:#050505;color:#f3f3f3;font-family:system-ui}
body{display:grid;place-items:center;padding:24px;text-align:center}
.card{max-width:480px;border:1px solid #e7a71a;border-radius:16px;padding:22px;background:#0b0b0c}
b{color:#e7a71a}p{color:#bbb;line-height:1.5}small{display:block;color:#58df48;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <b>SPACE16154</b>
  <h2>Reset cache</h2>
  <p id="status">Pulizia in corso…</p>
  <small>BUILD 20260810-0606-flat1</small>
</div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs) await r.unregister();
    }
    if('caches' in window){
      const keys=await caches.keys();
      for(const k of keys) await caches.delete(k);
    }
    localStorage.clear(); sessionStorage.clear();
    document.getElementById('status').textContent='Pulizia completata. Apro la nuova build…';
    setTimeout(()=>location.replace('index.html?b=20260810-0606-flat1&t='+Date.now()),800);
  }catch(e){
    document.getElementById('status').textContent='Errore reset: '+e.message;
  }
})();
</script>
</body>
</html>
